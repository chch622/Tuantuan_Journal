# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Network timeout (60 seconds for slow mirrors)
systemProp.http.connectionTimeout=60000
systemProp.http.socketTimeout=60000

# Use system JDK 21 instead of downloaded JDK 25
org.gradle.java.home=C:\\JAVA program

# AndroidX package structure
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Non-transitive R classes
android.nonTransitiveRClass=true

# AGP 9.x built-in Kotlin: allow KSP to add Kotlin sources via kotlin.sourceSets
# Required until KSP plugin is updated to use android.sourceSets DSL
android.disallowKotlinSourceSets=false
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
